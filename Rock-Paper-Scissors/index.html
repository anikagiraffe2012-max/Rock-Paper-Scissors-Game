<!DOCTYPE html>
<html>
    <head>
        <title>Rock Paper Scissors Game</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body>
        <div class="container">
            <div>
            <button id="rock">🪨Rock</button>
            <button id="paper">📄Paper</button>
            <button id="scissors">✂️Scissors</button>
            </div>
        <p>Your choice: <span id="playerChoice">-</span></p>
        <p>Computer choice: <span id="computerChoice">-</span></p>
        <p>Result: <span id="result">-</span></p>
        <p>Score: You <span id="playerScore">0</span> - <span id="computerScore">0</span> Computer</p>
        </div>
        <script src="script.js"></script>
    </body>
</html>
